<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Mundo - Organizadora Personal</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        }
        .smooth-transition {
            transition: all 0.3s ease;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // Iconos SVG
        const Settings = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M12 1v6m0 6v6M4.22 4.22l4.24 4.24m2.98 2.98l4.24 4.24M1 12h6m6 0h6m-17.78 7.78l4.24-4.24m2.98-2.98l4.24-4.24"></path>
            </svg>
        );

        const ChevronLeft = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        );

        const ChevronRight = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        );

        const Plus = () => (
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        );

        const Home = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
        );

        const ShoppingBag = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <circle cx="9" cy="21" r="1"></circle>
                <circle cx="20" cy="21" r="1"></circle>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
        );

        const Heart = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
            </svg>
        );

        const MapPin = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                <circle cx="12" cy="10" r="3"></circle>
            </svg>
        );

        const Star = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2">
                <polygon points="12 2 15.09 10.26 23.77 10.26 17.44 15.74 19.53 23.98 12 18.5 4.47 23.98 6.56 15.74 0.23 10.26 8.91 10.26 12 2"></polygon>
            </svg>
        );

        // CONTEXTO DE TEMA GLOBAL
        const ThemeContext = React.createContext();

        const themes = {
            masculine: {
                primary: '#3B82F6',
                accent: '#1E40AF',
                light: '#DBEAFE',
                text: '#1E3A8A',
                name: 'Masculino',
                icon: '👨'
            },
            feminine: {
                primary: '#D8A5C4',      // Rosa pastel suave
                accent: '#C291B0',       // Rosa pastel más oscuro
                light: '#F5E8F0',        // Fondo muy claro
                text: '#6B3A5C',         // Texto marrón suave
                name: 'Femenino',
                icon: '👩'
            },
            neutral: {
                primary: '#9CA3AF',
                accent: '#6B7280',
                light: '#F3F4F6',
                text: '#374151',
                name: 'Neutro',
                icon: '⚪'
            }
        };

        // COMPONENTE: SELECTOR DE TEMA EN HEADER
        const ThemeSelector = ({ theme, setTheme }) => {
            const [showMenu, setShowMenu] = useState(false);
            const currentTheme = themes[theme];

            return (
                <div className="relative">
                    <button
                        onClick={() => setShowMenu(!showMenu)}
                        className="p-2 rounded-lg hover:bg-white/50 smooth-transition"
                        style={{ color: currentTheme.primary }}
                        title="Cambiar apariencia"
                    >
                        <Settings />
                    </button>

                    {showMenu && (
                        <div className="absolute right-0 top-full mt-2 bg-white rounded-lg shadow-lg p-3 z-50 w-44">
                            {Object.entries(themes).map(([key, value]) => (
                                <button
                                    key={key}
                                    onClick={() => {
                                        setTheme(key);
                                        setShowMenu(false);
                                    }}
                                    className="block w-full text-left px-4 py-2 rounded mb-2 smooth-transition font-medium text-sm"
                                    style={{
                                        backgroundColor: theme === key ? value.light : 'transparent',
                                        color: value.text,
                                        borderLeft: theme === key ? `4px solid ${value.primary}` : 'none',
                                    }}
                                >
                                    {value.icon} {value.name}
                                </button>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        // COMPONENTE: NAVEGACIÓN
        const Navigation = ({ currentPage, setCurrentPage, theme, setTheme }) => {
            const currentTheme = themes[theme];
            const pages = [
                { id: 'calendario', name: 'Calendario', icon: Home },
                { id: 'shopping', name: 'Shopping', icon: ShoppingBag },
                { id: 'style', name: 'Style', icon: Heart },
                { id: 'places', name: 'Lugares', icon: MapPin }
            ];

            return (
                <nav className="bg-white border-b" style={{ borderColor: currentTheme.light }}>
                    <div className="flex items-center justify-between px-8 py-4">
                        <div>
                            <h1 className="text-2xl font-bold" style={{ color: currentTheme.text }}>
                                Mi Mundo
                            </h1>
                            <p className="text-xs text-gray-500">Tu organizadora personal</p>
                        </div>

                        <div className="flex gap-1">
                            {pages.map(page => {
                                const Icon = page.icon;
                                return (
                                    <button
                                        key={page.id}
                                        onClick={() => setCurrentPage(page.id)}
                                        className="flex items-center gap-2 px-4 py-2 rounded-lg smooth-transition font-medium text-sm"
                                        style={{
                                            backgroundColor: currentPage === page.id ? currentTheme.light : 'transparent',
                                            color: currentPage === page.id ? currentTheme.text : currentTheme.accent,
                                        }}
                                    >
                                        <Icon />
                                        {page.name}
                                    </button>
                                );
                            })}
                        </div>

                        <ThemeSelector theme={theme} setTheme={setTheme} />
                    </div>
                </nav>
            );
        };

        // COMPONENTE: CALENDARIO
        const Calendario = ({ theme }) => {
            const [currentDate, setCurrentDate] = useState(new Date(2026, 7, 11));
            const [selectedDate, setSelectedDate] = useState(new Date(2026, 7, 11));
            const currentTheme = themes[theme];

            const eventos = {
                '2026-08-11': [
                    { id: 1, title: 'Inglés – Repaso gramática', time: '10:00 AM', category: 'Estudio', color: '#7C3AED' },
                    { id: 2, title: 'Tarea: Investigación', time: '1:00 PM', category: 'Estudio', color: '#7C3AED' },
                    { id: 3, title: 'Clase presencial Universidad', time: '3:30 PM', category: 'Universidad', color: '#FBBF24' },
                    { id: 4, title: 'Terapia Maite', time: '5:30 PM', category: 'Personal', color: '#EC4899' }
                ]
            };

            const getDaysInMonth = (date) => {
                return new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
            };

            const getFirstDayOfMonth = (date) => {
                return new Date(date.getFullYear(), date.getMonth(), 1).getDay();
            };

            const daysInMonth = getDaysInMonth(currentDate);
            const firstDayOfMonth = getFirstDayOfMonth(currentDate);
            const days = [];

            for (let i = 0; i < firstDayOfMonth; i++) {
                days.push(null);
            }

            for (let i = 1; i <= daysInMonth; i++) {
                days.push(i);
            }

            const dateKey = selectedDate.toISOString().split('T')[0];
            const eventosDelDia = eventos[dateKey] || [];

            const categoryColors = {
                'Estudio': '#7C3AED',
                'Personal': '#EC4899',
                'Salud': '#EC4899',
                'Universidad': '#FBBF24',
                'Importante': '#F97316',
                'Otro': '#06B6D4'
            };

            const monthNames = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
                'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
            const dayNames = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];

            return (
                <div style={{ backgroundColor: currentTheme.light }} className="min-h-screen p-8 smooth-transition">
                    {/* Header */}
                    <div className="flex justify-between items-center mb-8">
                        <div>
                            <h2 className="text-3xl font-bold" style={{ color: currentTheme.text }}>
                                Calendario 2026
                            </h2>
                            <p className="text-gray-500 mt-1">Planificador de estudio con IA</p>
                        </div>

                        <button
                            className="flex items-center gap-2 px-4 py-3 rounded-lg text-white font-medium smooth-transition hover:shadow-lg"
                            style={{ backgroundColor: currentTheme.primary }}
                        >
                            <Plus />
                            Agregar evento
                        </button>
                    </div>

                    {/* Contenido */}
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        {/* Calendario */}
                        <div className="lg:col-span-2">
                            {/* Navegación mes */}
                            <div className="flex justify-between items-center mb-6">
                                <button
                                    onClick={() => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() - 1))}
                                    className="p-2 hover:bg-white/50 rounded-lg smooth-transition"
                                    style={{ color: currentTheme.primary }}
                                >
                                    <ChevronLeft />
                                </button>
                                <h3 className="text-2xl font-bold" style={{ color: currentTheme.text }}>
                                    {monthNames[currentDate.getMonth()]} {currentDate.getFullYear()}
                                </h3>
                                <button
                                    onClick={() => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + 1))}
                                    className="p-2 hover:bg-white/50 rounded-lg smooth-transition"
                                    style={{ color: currentTheme.primary }}
                                >
                                    <ChevronRight />
                                </button>
                            </div>

                            {/* Días semana */}
                            <div className="grid grid-cols-7 gap-2 mb-4">
                                {dayNames.map(day => (
                                    <div key={day} className="text-center font-bold text-sm" style={{ color: currentTheme.accent }}>
                                        {day}
                                    </div>
                                ))}
                            </div>

                            {/* Grid días */}
                            <div className="grid grid-cols-7 gap-2 bg-white p-4 rounded-xl shadow-sm">
                                {days.map((day, index) => (
                                    <button
                                        key={index}
                                        onClick={() => day && setSelectedDate(new Date(currentDate.getFullYear(), currentDate.getMonth(), day))}
                                        className="aspect-square p-2 rounded-lg font-semibold smooth-transition"
                                        style={{
                                            backgroundColor: day && selectedDate.getDate() === day && selectedDate.getMonth() === currentDate.getMonth()
                                                ? currentTheme.primary
                                                : day ? 'white' : 'transparent',
                                            color: day && selectedDate.getDate() === day && selectedDate.getMonth() === currentDate.getMonth()
                                                ? 'white'
                                                : day ? currentTheme.text : '#D1D5DB',
                                            cursor: day ? 'pointer' : 'default',
                                            fontSize: '14px',
                                            border: `1px solid ${currentTheme.light}`
                                        }}
                                    >
                                        {day}
                                    </button>
                                ))}
                            </div>

                            {/* Leyenda */}
                            <div className="mt-8 pt-6" style={{ borderTop: `2px solid ${currentTheme.light}` }}>
                                <p className="text-sm font-bold mb-3" style={{ color: currentTheme.text }}>Categorías</p>
                                <div className="grid grid-cols-3 gap-3">
                                    {Object.entries(categoryColors).map(([category, color]) => (
                                        <div key={category} className="flex items-center gap-2">
                                            <div className="w-3 h-3 rounded-full" style={{ backgroundColor: color }} />
                                            <span className="text-xs" style={{ color: currentTheme.text }}>
                                                {category}
                                            </span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                        {/* Panel lateral */}
                        <div className="bg-white p-6 rounded-xl shadow-sm">
                            <div className="mb-6">
                                <h4 className="text-sm font-bold text-gray-500 mb-2">DÍA SELECCIONADO</h4>
                                <p className="text-lg font-bold" style={{ color: currentTheme.text }}>
                                    {selectedDate.getDate()} de {monthNames[selectedDate.getMonth()]}, {selectedDate.getFullYear()}
                                </p>
                            </div>

                            {eventosDelDia.length > 0 ? (
                                <div className="space-y-3 mb-6">
                                    {eventosDelDia.map(evento => (
                                        <div
                                            key={evento.id}
                                            className="p-4 rounded-lg"
                                            style={{
                                                backgroundColor: evento.color + '15',
                                                borderLeft: `4px solid ${evento.color}`
                                            }}
                                        >
                                            <div className="flex justify-between items-start mb-1">
                                                <p className="font-semibold text-sm" style={{ color: currentTheme.text }}>
                                                    {evento.title}
                                                </p>
                                                <span className="text-xs font-bold" style={{ color: evento.color }}>
                                                    {evento.time}
                                                </span>
                                            </div>
                                            <p className="text-xs" style={{ color: currentTheme.accent }}>
                                                {evento.category}
                                            </p>
                                        </div>
                                    ))}
                                </div>
                            ) : (
                                <p className="text-sm text-gray-400 italic mb-6">No hay eventos este día</p>
                            )}

                            {/* IA */}
                            <div className="pt-6" style={{ borderTop: `2px solid ${currentTheme.light}` }}>
                                <div className="flex items-center gap-2 mb-3">
                                    <span className="text-2xl">🧠</span>
                                    <h5 className="font-bold" style={{ color: currentTheme.text }}>Planificadora IA</h5>
                                </div>
                                <p className="text-xs text-gray-600 mb-4">Tu asistente de organización</p>
                                <button
                                    className="w-full py-3 rounded-lg text-white font-semibold smooth-transition hover:shadow-lg"
                                    style={{ backgroundColor: currentTheme.primary }}
                                >
                                    ✨ Planificar con IA
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // COMPONENTE: SHOPPING
        const Shopping = ({ theme }) => {
            const currentTheme = themes[theme];

            return (
                <div style={{ backgroundColor: currentTheme.light }} className="min-h-screen p-8 smooth-transition">
                    <h2 className="text-3xl font-bold mb-8" style={{ color: currentTheme.text }}>
                        🛍️ Shopping List
                    </h2>
                    <div className="bg-white rounded-xl shadow-sm p-8 text-center">
                        <p style={{ color: currentTheme.accent }}>Sección en construcción</p>
                    </div>
                </div>
            );
        };

        // COMPONENTE: STYLE
        const Style = ({ theme }) => {
            const currentTheme = themes[theme];

            return (
                <div style={{ backgroundColor: currentTheme.light }} className="min-h-screen p-8 smooth-transition">
                    <h2 className="text-3xl font-bold mb-8" style={{ color: currentTheme.text }}>
                        👗 Mi Estilo
                    </h2>
                    <div className="bg-white rounded-xl shadow-sm p-8 text-center">
                        <p style={{ color: currentTheme.accent }}>Sección en construcción</p>
                    </div>
                </div>
            );
        };

        // COMPONENTE: PLACES
        const Places = ({ theme }) => {
            const currentTheme = themes[theme];

            return (
                <div style={{ backgroundColor: currentTheme.light }} className="min-h-screen p-8 smooth-transition">
                    <h2 className="text-3xl font-bold mb-8" style={{ color: currentTheme.text }}>
                        📍 Mis Lugares Favoritos
                    </h2>
                    <div className="bg-white rounded-xl shadow-sm p-8 text-center">
                        <p style={{ color: currentTheme.accent }}>Sección en construcción</p>
                    </div>
                </div>
            );
        };

        // APP PRINCIPAL
        const MiMundoApp = () => {
            const [currentPage, setCurrentPage] = useState('calendario');
            const [theme, setTheme] = useState('neutral');

            return (
                <div className="smooth-transition">
                    <Navigation currentPage={currentPage} setCurrentPage={setCurrentPage} theme={theme} setTheme={setTheme} />

                    {/* Actualizar tema globalmente */}
                    <div>
                        {currentPage === 'calendario' && <Calendario theme={theme} />}
                        {currentPage === 'shopping' && <Shopping theme={theme} />}
                        {currentPage === 'style' && <Style theme={theme} />}
                        {currentPage === 'places' && <Places theme={theme} />}
                    </div>
                </div>
            );
        };

        ReactDOM.render(<MiMundoApp />, document.getElementById('root'));
    </script>
</body>
</html>
